name: Build AnimePower jar

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for generated wrapper step
        run: |
          # Generate the Gradle wrapper (gradlew) since it isn't in the repo
          curl -s -L -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.1.1-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.1.1/bin/gradle wrapper --gradle-version 8.1.1
          chmod +x gradlew

      - name: Build with Gradle wrapper
        run: ./gradlew build --no-daemon

      - name: Upload built jar
        uses: actions/upload-artifact@v4
        with:
          name: AnimePower-jar
          path: build/libs/*.jar
